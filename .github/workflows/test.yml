name: Tests

on:
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: false
        description: "Run full Python version matrix (all versions) instead of boundary versions"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # asdf-nim reads GITHUB_TOKEN directly for release lookups and rate limits,
    # as the plugin's own CI example does.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      # false, for the same reason -x is gone from the pytest invocation below:
      # the deliverable of the skip gate is the complete inventory of what did
      # not run, and cancelling the other legs on the first failure surrenders
      # exactly the per-platform half of it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJSON(inputs.full-matrix && '["3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.10", "3.14"]') }}
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install libclang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Install libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Verify LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          clang --version
          which clang || true
      # The Nim end-to-end gates -- the ones that compile, link and execute the
      # scaffolded output -- skipped on every leg because no workflow installed
      # Nim, and a skip is the same colour as a pass.
      #
      # Nim arrives from two places, because no single one covers the matrix.
      #
      # macOS and Linux: asdf-nim, which installs a PRE-COMPILED binary. The
      # selector is `latest:2.2` on both, and it does not source-build on macOS
      # arm64 despite there being no official Nim binary for that platform:
      # asdf_nim_find_exact_nightly_url resolves the stable release to its
      # commit and fetches the NIGHTLY BUILD OF THAT SAME COMMIT, so the binary
      # matches the stable source rather than drifting to a newer one. The
      # plugin's own CI has to set ASDF_NIM_NO_NIGHTLY_FALLBACK=1 to force a
      # source build out of this exact selector, which is the evidence that the
      # fallback is what runs by default. One selector for both legs is
      # therefore correct, and a `ref:` nightly here would pin a *different*
      # commit from the one Linux gets.
      #
      # Windows: asdf-nim states its scope as macOS and Linux, and its CI
      # matrix tests no Windows runner at all, so setup-nim-action keeps that
      # leg. It has official prebuilt Windows binaries and was never the leg
      # that failed.
      - name: Install Nim (macOS, Linux)
        if: runner.os != 'Windows'
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim latest:2.2
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Nim (Windows)
        if: runner.os == 'Windows'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ github.token }}
      # On the record, per leg: a version claimed is not a version installed.
      - name: Record the Nim that was installed
        shell: bash
        run: nim --version
      - name: Install package
        shell: bash
        run: pip install -e '.[test,treesitter]'
      # Fail here, naming the tool, rather than several minutes later inside a
      # test. Every one of these is a hard requirement of the suite under CI:
      # tests/skip_policy.py turns a missing one into a failure, and the session
      # gate in tests/conftest.py fails the run on any skip it did not sanction.
      - name: Verify the toolchain the suite requires
        shell: bash
        run: python scripts/check_test_toolchain.py
      - name: Cache test header downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/headerkit-test-headers
          key: test-headers-v2
      # -rs prints skip reasons, which the default output hides entirely.
      # -x is deliberately absent: the point of the session gate is the full
      # inventory of what did not run, and stopping at the first failure would
      # surrender exactly that.
      - name: Run tests
        shell: bash
        run: pytest -rs
