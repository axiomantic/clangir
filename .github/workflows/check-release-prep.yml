name: Check release prep

on:
  pull_request:
    paths-ignore:
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A stack of PRs is one release. The parent carries the version bump and the
    # changelog entry; a child stacked on it correctly carries neither. Only the
    # PR into the default branch has a defined answer to "is this release ready".
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version bump
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
            echo "::error::Base ref origin/$BASE_REF is not present in this checkout; cannot compare versions."
            exit 1
          fi

          BASE_VERSION=$(git show "origin/$BASE_REF:pyproject.toml" | grep '^version' | sed 's/version = "\(.*\)"/\1/') \
            || { echo "::error::No version line in pyproject.toml at origin/$BASE_REF"; exit 1; }
          PR_VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/') \
            || { echo "::error::No version line in pyproject.toml on this branch"; exit 1; }

          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "::warning::Version in pyproject.toml ($PR_VERSION) has not changed. If this PR includes user-facing changes, bump the version before merging."
          else
            echo "Version bumped: $BASE_VERSION -> $PR_VERSION"
          fi

      - name: Check changelog
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
            echo "::error::Base ref origin/$BASE_REF is not present in this checkout; cannot diff against the base."
            exit 1
          fi

          CHANGED_FILES=$(git diff "origin/$BASE_REF...HEAD" --name-only)

          # Matched without a pipe: grep -q closes the pipe on its first match, and
          # on a diff exceeding the 64K pipe buffer the writer then takes SIGPIPE,
          # which pipefail reports as a failed match.
          case $'\n'"$CHANGED_FILES"$'\n' in
            *$'\nCHANGELOG.md\n'*)
              echo "CHANGELOG.md has been updated."
              ;;
            *)
              echo "::warning::CHANGELOG.md has not been modified. If this PR includes user-facing changes, add a changelog entry before merging."
              ;;
          esac
